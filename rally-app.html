<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rally — Mobile App Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       DESIGN SYSTEM — PHASE 0
       Every value below is a token. No hardcoded colors/sizes in UI.
       ============================================================ */
    :root {
      /* Neutral scale — zinc foundation */
      --color-white: #FFFFFF;
      --color-gray-50: #FAFAFA;
      --color-gray-100: #F4F4F5;
      --color-gray-200: #E4E4E7;
      --color-gray-300: #D4D4D8;
      --color-gray-400: #A1A1AA;
      --color-gray-500: #71717A;
      --color-gray-600: #52525B;
      --color-gray-700: #3F3F46;
      --color-gray-800: #27272A;
      --color-gray-900: #18181B;

      /* Accent — deep indigo, used SPARINGLY */
      --color-accent: #4F46E5;
      --color-accent-hover: #4338CA;
      --color-accent-pressed: #3730A3;
      --color-accent-light: #EEF2FF;
      --color-accent-subtle: #E0E7FF;

      /* Semantic */
      --color-success: #059669;
      --color-error: #DC2626;
      --color-warning: #D97706;

      /* Surfaces */
      --color-surface: var(--color-white);
      --color-canvas: var(--color-gray-50);
      --color-border: var(--color-gray-200);
      --color-border-emphasis: var(--color-gray-300);

      /* Text hierarchy */
      --color-text-primary: var(--color-gray-900);
      --color-text-secondary: var(--color-gray-700);
      --color-text-tertiary: var(--color-gray-500);
      /* Quaternary is decoupled from --color-gray-400 (#A1A1AA) which fails WCAG AA
         on white for small text. #767680 passes AA (4.51:1) while staying visibly
         lighter than tertiary. --color-gray-400 remains available for icons/borders. */
      --color-text-quaternary: #767680;
      --color-text-on-accent: var(--color-white);

      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --text-title: 700 28px/1.2 var(--font-family);
      --text-heading: 600 18px/1.3 var(--font-family);
      --text-body: 400 15px/1.5 var(--font-family);
      --text-body-medium: 500 15px/1.5 var(--font-family);
      --text-label: 500 13px/1.4 var(--font-family);
      --text-caption: 400 13px/1.4 var(--font-family);
      --text-overline: 500 11px/1.3 var(--font-family);

      --tracking-tight: -0.01em;
      --tracking-normal: 0;
      --tracking-wide: 0.05em;
      --tracking-wider: 0.08em;

      /* Spacing (8px grid, 4 as half-step) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;
      --space-10: 64px;

      /* Component tokens */
      --radius-input: 4px;
      --radius-button: 8px;
      --radius-card: 12px;
      --radius-pill: 9999px;

      --shadow-sheet: 0 -4px 24px rgba(0,0,0,0.08);
      --shadow-modal: 0 8px 32px rgba(0,0,0,0.12);

      --transition-fast: 100ms ease;
      --transition-normal: 200ms ease;
      --transition-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);

      --touch-min: 44px;

      --screen-width: 390px;
      --screen-height: 844px;
      --safe-area-top: 54px;
      --safe-area-bottom: 34px;
      --tab-bar-height: 56px;
    }

    /* ============================================================
       RESET
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: var(--text-body);
      color: var(--color-text-primary);
      background: var(--color-canvas);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      color: inherit;
    }

    /* ============================================================
       SHOWCASE SHELL
       ============================================================ */

    /* Top bar */
    .showcase-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 48px;
      background: var(--color-gray-50);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
      font: var(--text-caption);
      color: var(--color-text-tertiary);
    }

    /* Screen selector */
    .screen-selector {
      display: flex;
      gap: var(--space-2);
      justify-content: center;
      flex-wrap: wrap;
      padding: var(--space-6) var(--space-4);
    }
    .screen-selector button {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-pill);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      font: var(--text-label);
      color: var(--color-text-secondary);
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }
    .screen-selector button:hover {
      border-color: var(--color-border-emphasis);
    }
    .screen-selector button.active {
      background: var(--color-accent);
      color: var(--color-text-on-accent);
      border-color: var(--color-accent);
    }

    /* Device frame */
    .device-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4) var(--space-4) var(--space-9);
    }
    .device-frame {
      width: calc(var(--screen-width) + 16px);
      height: calc(var(--screen-height) + 16px);
      background: #000;
      border: 8px solid #1A1A1A;
      border-radius: 40px;
      padding: 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .device-viewport {
      width: var(--screen-width);
      height: var(--screen-height);
      background: var(--color-surface);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    /* Hide scrollbar in viewport for cleaner look */
    .device-viewport::-webkit-scrollbar { width: 0; height: 0; }

    /* Dynamic island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 18px;
      z-index: 100;
      pointer-events: none;
    }

    /* Caption below device */
    .device-caption {
      margin-top: var(--space-5);
      text-align: center;
      max-width: 480px;
    }
    .device-caption .name {
      font: var(--text-body-medium);
      color: var(--color-text-secondary);
      display: block;
      margin-bottom: var(--space-1);
    }
    .device-caption .desc {
      font: var(--text-caption);
      color: var(--color-text-tertiary);
    }

    /* ============================================================
       SCREEN SHARED — status bar (top of every screen)
       ============================================================ */
    .status-bar {
      height: var(--safe-area-top);
      padding: 0 var(--space-6);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: var(--space-2);
      background: var(--color-surface);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .status-bar .time {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-left: var(--space-4);
    }
    .status-bar .indicators {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      color: var(--color-text-primary);
      margin-right: var(--space-2);
    }

    /* Screen containers */
    .screen {
      display: none;
      min-height: 100%;
      flex-direction: column;
      background: var(--color-surface);
    }
    .screen.active { display: flex; }

    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       APP COMPONENTS
       ============================================================ */

    /* App header (title + actions) */
    .app-header {
      height: 48px;
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-surface);
      flex-shrink: 0;
    }
    .app-header h1 {
      font: var(--text-heading);
      color: var(--color-text-primary);
      margin: 0;
    }
    .icon-btn {
      min-width: var(--touch-min);
      min-height: var(--touch-min);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      transition: color var(--transition-fast);
      margin-right: calc(var(--space-2) * -1);
    }
    .icon-btn:hover { color: var(--color-text-secondary); }

    /* Horizontal pills row (scrollable) */
    .pills-row {
      display: flex;
      gap: var(--space-2);
      padding: 0 var(--space-4);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex-shrink: 0;
    }
    .pills-row::-webkit-scrollbar { display: none; }
    .pill {
      flex: 0 0 auto;
      scroll-snap-align: start;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: var(--color-gray-100);
      color: var(--color-text-secondary);
      font: var(--text-overline);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      border: none;
      white-space: nowrap;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .pill.active {
      background: var(--color-accent);
      color: var(--color-text-on-accent);
    }

    /* Section label (overline text used across screens) */
    .section-label {
      font: var(--text-overline);
      color: var(--color-text-quaternary);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
      padding: var(--space-5) var(--space-4) var(--space-3);
      margin: 0;
    }

    /* Group card */
    .group-card {
      display: block;
      width: calc(100% - var(--space-4) * 2);
      margin: 0 var(--space-4) var(--space-3);
      padding: var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      text-align: left;
      transition: transform var(--transition-fast), border-color var(--transition-fast);
    }
    .group-card:hover { border-color: var(--color-border-emphasis); }
    .group-card:active { transform: scale(0.98); }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .pill-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--color-gray-100);
      color: var(--color-text-secondary);
      font: var(--text-overline);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
    }
    .card-time {
      font: var(--text-caption);
      color: var(--color-text-quaternary);
      white-space: nowrap;
    }
    .card-name {
      font-family: var(--font-family);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--color-text-primary);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-desc {
      font: var(--text-caption);
      color: var(--color-text-tertiary);
      margin: var(--space-1) 0 var(--space-3);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .spots {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font: var(--text-caption);
      color: var(--color-text-secondary);
    }
    .spots.almost-full { color: var(--color-accent); }
    .spots.full { color: var(--color-text-quaternary); }
    .card-creator {
      font: var(--text-caption);
      color: var(--color-text-quaternary);
      white-space: nowrap;
    }

    /* Feed wrapper — leaves room above the tab bar */
    .feed {
      padding-bottom: var(--space-4);
    }

    /* Bottom tab bar */
    .tab-bar {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding-bottom: var(--safe-area-bottom);
      display: flex;
      align-items: stretch;
      z-index: 5;
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      min-height: var(--touch-min);
      height: var(--tab-bar-height);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--color-text-quaternary);
      font-family: var(--font-family);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: var(--tracking-wide);
      transition: color var(--transition-fast);
    }
    .tab.active { color: var(--color-accent); }
    .tab .tab-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tab-create .tab-icon {
      width: 32px;
      height: 32px;
      background: var(--color-accent);
      color: var(--color-text-on-accent);
      border-radius: var(--radius-pill);
    }

    /* Placeholder styling for screens not yet built */
    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }
    .placeholder-content {
      max-width: 260px;
    }
    .placeholder-content h3 {
      font: var(--text-heading);
      color: var(--color-text-primary);
      margin: 0 0 var(--space-2);
    }
    .placeholder-content p {
      font: var(--text-caption);
      color: var(--color-text-tertiary);
      margin: 0;
    }

    /* Responsive: scale device on small screens */
    @media (max-width: 480px) {
      .device-frame {
        transform: scale(0.85);
        transform-origin: top center;
      }
      .device-stage {
        padding-bottom: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="showcase-topbar">
    <span>Rally — Mobile App Design</span>
    <span>Charly Chaves · 2026</span>
  </header>

  <!-- Screen selector -->
  <nav class="screen-selector" id="screenSelector">
    <button class="active" data-screen="home" data-desc="The explore feed — categories, group cards, group discovery.">Home</button>
    <button data-screen="detail" data-desc="Group detail view — full description, roles, members, apply CTA.">Group Detail</button>
    <button data-screen="create" data-desc="Create a new group — single scrollable form, no wizard.">Create</button>
    <button data-screen="mygroups" data-desc="Groups you created or joined — with pending applicant management.">My Groups</button>
    <button data-screen="profile" data-desc="Your profile — bio, skills, stats, account menu.">Profile</button>
    <button data-screen="search" data-desc="Search groups with category and size filters.">Search</button>
  </nav>

  <!-- Device stage -->
  <section class="device-stage">
    <div class="device-frame">
      <div class="dynamic-island"></div>
      <div class="device-viewport" id="deviceViewport">

        <!-- Screen: Home -->
        <div class="screen active" data-screen="home">
          <div class="status-bar-mount"></div>
          <div class="screen-content">
            <header class="app-header">
              <h1>Hey, Mati</h1>
              <button class="icon-btn" aria-label="Notifications">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              </button>
            </header>

            <nav class="pills-row" aria-label="Categories">
              <button class="pill active">All</button>
              <button class="pill">Tech</button>
              <button class="pill">Sports</button>
              <button class="pill">Music</button>
              <button class="pill">Creative</button>
              <button class="pill">Social</button>
              <button class="pill">Events</button>
              <button class="pill">Education</button>
            </nav>

            <h2 class="section-label">Near you</h2>

            <div class="feed">
              <button class="group-card">
                <div class="card-top">
                  <span class="pill-tag">Tech</span>
                  <span class="card-time">2h ago</span>
                </div>
                <div class="card-name">Habit tracker app</div>
                <div class="card-desc">Building a minimal habit tracking app. Looking for a React Native dev and someone to handle backend.</div>
                <div class="card-bottom">
                  <span class="spots almost-full">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    1/3 spots
                  </span>
                  <span class="card-creator">by Mati R.</span>
                </div>
              </button>

              <button class="group-card">
                <div class="card-top">
                  <span class="pill-tag">Sports</span>
                  <span class="card-time">5h ago</span>
                </div>
                <div class="card-name">Sunday 5-a-side</div>
                <div class="card-desc">Weekly football in Palermo. We play every Sunday 10am, need 2 more regulars.</div>
                <div class="card-bottom">
                  <span class="spots">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    8/10 spots
                  </span>
                  <span class="card-creator">by Nico F.</span>
                </div>
              </button>

              <button class="group-card">
                <div class="card-top">
                  <span class="pill-tag">Music</span>
                  <span class="card-time">1d ago</span>
                </div>
                <div class="card-name">Jazz trio for bar gigs</div>
                <div class="card-desc">Keys player and drummer looking for a bass player. We rehearse Thursdays in Villa Crespo.</div>
                <div class="card-bottom">
                  <span class="spots">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    2/3 spots
                  </span>
                  <span class="card-creator">by Javier M.</span>
                </div>
              </button>

              <button class="group-card">
                <div class="card-top">
                  <span class="pill-tag">Social</span>
                  <span class="card-time">2d ago</span>
                </div>
                <div class="card-name">Weekend hiking crew</div>
                <div class="card-desc">Monthly hikes around Buenos Aires province. All levels welcome. Next: Tandil in March.</div>
                <div class="card-bottom">
                  <span class="spots">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

                  </span>
                  <span class="card-creator">by Cami L.</span>
                </div>
              </button>

                <div class="card-top">
                  <span class="pill-tag">Creative</span>
                  <span class="card-time">3d ago</span>

                  <span class="spots">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    3/5 spots
                  </span>
                  <span class="card-creator">by Ana P.</span>
                </div>
              </button>

              <button class="group-card">
                <div class="card-top">
                  <span class="pill-tag">Education</span>
                  <span class="card-time">4d ago</span>
                </div>
                <div class="card-name">IELTS study group</div>
                <div class="card-desc">Preparing for December IELTS. Meeting twice a week on Zoom to practice speaking.</div>
                <div class="card-bottom">
                  <span class="spots">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    4/6 spots
                  </span>
                  <span class="card-creator">by Lucia T.</span>
                </div>
              </button>
            </div>
          </div>

          <nav class="tab-bar" aria-label="Main navigation">

      </span>
    </div>
  </template>

  <script>
    (function() {
      // Inject the status bar into every screen mount point
      const tpl = document.getElementById('statusBarTemplate');
      document.querySelectorAll('.status-bar-mount').forEach(mount => {
        mount.replaceWith(tpl.content.cloneNode(true));
      });

      const selector = document.getElementById('screenSelector');
      const viewport = document.getElementById('deviceViewport');
      const captionName = document.getElementById('captionName');
      const captionDesc = document.getElementById('captionDesc');

      selector.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const screen = btn.dataset.screen;
        if (!screen) return;

        selector.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        viewport.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = viewport.querySelector(`.screen[data-screen="${screen}"]`);
        if (target) target.classList.add('active');

        captionName.textContent = btn.textContent.trim();
        captionDesc.textContent = btn.dataset.desc || '';

        viewport.scrollTop = 0;
      });
    })();
  </script>
